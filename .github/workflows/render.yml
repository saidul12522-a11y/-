
name: Render Mosquito Explainer Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract ZIP Automatically
        run: |
          mkdir -p project
          unzip -q "saidul-মশা-video.zip" -d project

      - name: Install Dependencies
        working-directory: project/MosquitoExplainer
        run: |
          rm -f package-lock.json
          npm install

      - name: Setup Remotion Browser
        working-directory: project/MosquitoExplainer
        run: npx remotion browser ensure

      - name: Render MP4 Video
        working-directory: project/MosquitoExplainer
        run: npm run render

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: Mosquito-Explainer-Video
          path: project/MosquitoExplainer/out/mosquito-explainer.mp4
          if-no-files-found: error
          retention-days: 7
