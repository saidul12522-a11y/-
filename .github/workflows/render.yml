
name: Render Video from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip -o ChatGPTIndiaExplainer_Backup_01_100pct.zip -d project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: project
        run: npm ci

      - name: Setup Remotion Browser
        working-directory: project
        run: npx remotion browser ensure

      - name: Render Video
        working-directory: project
        run: |
          mkdir -p out
          npm run render

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTIndia-Rendered-Video
          path: project/out/chatgpt-india.mp4
          if-no-files-found: error
          retention-days: 7
