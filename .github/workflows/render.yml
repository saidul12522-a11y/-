name: Render video

# Repo-তে প্রজেক্ট ZIP (যেমন MosquitoExplainer_Final_v01.zip) যেমন আছে তেমনই রাখুন, ZIP খোলার দরকার নেই।
# Actions ট্যাব > "Render video" > Run workflow চাপলে ZIP খুলে MP4 রেন্ডার হবে।
on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "ZIP ফাইলের নাম (খালি রাখলে root-এর সর্বশেষ *_Final_v*.zip)"
        required: false
        default: ""
      composition:
        description: "Composition ID"
        required: false
        default: "MosquitoExplainer"
  push:
    paths:
      - "*_Final_v*.zip"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          Z="${{ github.event.inputs.zip_file }}"
          if [ -z "$Z" ]; then
            Z="$(ls -1 *_Final_v*.zip 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$Z" ] || [ ! -f "$Z" ]; then
            echo "::error::ZIP file not found in repo root. Upload e.g. MosquitoExplainer_Final_v01.zip"
            exit 1
          fi
          echo "name=$Z" >> "$GITHUB_OUTPUT"
          echo "base=${Z%.zip}" >> "$GITHUB_OUTPUT"
          echo "Using $Z"

      - name: Unzip project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          unzip -q -o "${{ steps.zip.outputs.name }}" -d build
          # package.json ZIP-এর root-এ না থাকলে (একটি nested folder থাকলে) সেটাই খুঁজে নেয়
          P="$(find build -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n 1)"
          [ -n "$P" ] || { echo "::error::package.json not found in ZIP"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$P")" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm-dev \
            libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libcups2 \
            libpango-1.0-0 libcairo2 ffmpeg

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci || npm install

      - name: Type check
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run typecheck

      - name: Render MP4
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "${{ github.event.inputs.composition || 'MosquitoExplainer' }}" out/video.mp4 \
            --codec=h264 --crf=18 --concurrency=2

      - name: Check output
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration -of default=nw=1 out/video.mp4
          ls -lh out/video.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.base }}_mp4
          path: ${{ env.PROJECT_DIR }}/out/video.mp4
          retention-days: 14
          if-no-files-found: error
