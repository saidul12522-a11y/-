name: Render Ghazal Video

on:
  workflow_dispatch:
    inputs:
      with_voiceover:
        description: "MP4-তে voiceover যুক্ত করবেন?"
        type: boolean
        default: false
      concurrency:
        description: "Render concurrency (যেমন 2 বা 50%) — ফাঁকা রাখলে ডিফল্ট"
        type: string
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system libraries for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libgbm-dev libcups2t64 libpango-1.0-0 libcairo2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Make sure Remotion's browser is available
        run: npx remotion browser ensure

      - name: Include voiceover in the MP4 (optional)
        if: ${{ inputs.with_voiceover }}
        run: sed -i 's/VOICEOVER_IN_RENDER = false/VOICEOVER_IN_RENDER = true/' src/components/PreviewAudio.tsx

      - name: Type check
        run: npm run typecheck

      - name: Render MP4
        run: |
          mkdir -p out
          ARGS=""
          if [ -n "${{ inputs.concurrency }}" ]; then ARGS="--concurrency=${{ inputs.concurrency }}"; fi
          npx remotion render src/index.ts Main out/video.mp4 $ARGS

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: ghazal-video
          path: out/video.mp4
          retention-days: 14
