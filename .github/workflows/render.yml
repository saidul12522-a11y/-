name: Render Rafi Story Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose rendering mode"
        type: choice
        default: test
        options:
          - test
          - full

      shots:
        description: "Full mode: all, force, or specific shots e.g. 3,7"
        type: string
        default: all

      shadows:
        description: "Enable soft shadows"
        type: choice
        default: "false"
        options:
          - "true"
          - "false"

      gl:
        description: "Chromium GL backend"
        type: choice
        default: swangle
        options:
          - swangle
          - angle
          - swiftshader
          - angle-egl

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 340

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP and Locate Project
        id: project
        shell: bash
        run: |
          set -e

          if [ -f package.json ]; then
            DIR="."
          else
            mapfile -t ZIPS < <(
              find . -maxdepth 1 -type f -iname "*.zip"
            )

            if [ "${#ZIPS[@]}" -eq 0 ]; then
              echo "ERROR: No ZIP file found!"
              exit 1
            fi

            if [ "${#ZIPS[@]}" -gt 1 ]; then
              echo "ERROR: Multiple ZIP files found. Keep only one project ZIP."
              exit 1
            fi

            mkdir -p _extracted

            unzip -q -o "${ZIPS[0]}" -d _extracted

            DIR=$(dirname "$(
              find _extracted -name package.json \
              -not -path '*/node_modules/*' | head -1
            )")

            if [ -z "$DIR" ] || [ ! -f "$DIR/package.json" ]; then
              echo "ERROR: package.json not found after extraction!"
              exit 1
            fi
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          echo "Project located: $DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ steps.project.outputs.dir }}/package.json

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            unzip \
            ffmpeg \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libgbm-dev \
            libasound2 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libatk-bridge2.0-0 \
            libpango-1.0-0 \
            libcairo2 \
            libcups2 \
            fonts-noto-core

          fc-cache -f

      - name: Install Project Dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          npm install --no-audit --no-fund

          npx remotion browser ensure

      - name: Restore Previous Rendered Shots
        if: ${{ inputs.mode == 'full' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.project.outputs.dir }}/out/shots
          key: rafi-shots-${{ github.run_id }}
          restore-keys: |
            rafi-shots-

      - name: Render Video
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          GL: ${{ inputs.gl }}
          SHADOWS: ${{ inputs.shadows }}
        run: |
          bash scripts/render.sh \
            "${{ inputs.mode }}" \
            "${{ inputs.shots }}"

      - name: Save Rendered Shots
        if: ${{ always() && inputs.mode == 'full' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.project.outputs.dir }}/out/shots
          key: rafi-shots-${{ github.run_id }}

      - name: Upload Rendered Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rafi-Story-${{ inputs.mode }}
          path: |
            ${{ steps.project.outputs.dir }}/out/final_video.mp4
            ${{ steps.project.outputs.dir }}/out/test_5s.mp4
            ${{ steps.project.outputs.dir }}/out/contact_sheet.png
            ${{ steps.project.outputs.dir }}/out/final_contact_sheet.png
            ${{ steps.project.outputs.dir }}/out/stills/
            ${{ steps.project.outputs.dir }}/out/qc.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Final Video Release
        if: ${{ inputs.mode == 'full' && success() }}
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "video-${{ github.run_number }}" \
            out/final_video.mp4 \
            out/final_contact_sheet.png \
            --repo "${{ github.repository }}" \
            --title "Rafi Story Video #${{ github.run_number }}" \
            --notes "Rendered automatically using GitHub Actions."
