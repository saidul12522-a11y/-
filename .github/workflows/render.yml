
name: Render Rafi Story Video

on:
  workflow_dispatch:
  push:
    paths:
      - 'rafi-story.zip'
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract ZIP Temporarily
        run: |
          mkdir -p "$RUNNER_TEMP/rafi-project"
          unzip -q "$GITHUB_WORKSPACE/rafi-story.zip" \
            -d "$RUNNER_TEMP/rafi-project"

      - name: Install Dependencies
        working-directory: ${{ runner.temp }}/rafi-project/rafi-story
        run: |
          npm install --no-audit --no-fund

      - name: Render Full HD Video
        working-directory: ${{ runner.temp }}/rafi-project/rafi-story
        run: |
          mkdir -p out

          npx remotion render \
            src/index.ts \
            RafiStory \
            out/rafi-story.mp4 \
            --codec=h264 \
            --image-format=jpeg \
            --concurrency=2

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: Rafi-Story-FullHD
          path: ${{ runner.temp }}/rafi-project/rafi-story/out/rafi-story.mp4
          if-no-files-found: error
          retention-days: 7
