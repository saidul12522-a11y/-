
name: Render Rahimer Chaya

on:
  workflow_dispatch:
  push:
    paths:
      - 'rahimer-chaya.zip'
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      - name: Prepare Project
        run: |
          mkdir -p "$RUNNER_TEMP/rahimer-project"
          unzip -q "$GITHUB_WORKSPACE/rahimer-chaya.zip" \
            -d "$RUNNER_TEMP/rahimer-project"
          echo "PROJECT_DIR=$RUNNER_TEMP/rahimer-project" >> $GITHUB_ENV

      - name: Install Dependencies
        working-directory: ${{ runner.temp }}/rahimer-project
        run: |
          npm install --no-audit --no-fund

      - name: Prepare Output
        working-directory: ${{ runner.temp }}/rahimer-project
        run: mkdir -p out

      - name: Render Video
        working-directory: ${{ runner.temp }}/rahimer-project
        run: |
          npx remotion render \
            src/index.ts \
            RahimerChaya \
            out/rahimer-chaya.mp4 \
            --concurrency=2

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: Rahimer-Chaya-Video
          path: ${{ runner.temp }}/rahimer-project/out/rahimer-chaya.mp4
          if-no-files-found: error
          retention-days: 7
