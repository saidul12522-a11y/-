
name: Render Rahimer Chaya

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check ZIP File
        run: |
          if [ ! -f "rahimer-chaya.zip" ]; then
            echo "ERROR: rahimer-chaya.zip not found in repository root."
            exit 1
          fi

      - name: Extract Project
        run: |
          mkdir -p project
          unzip -q rahimer-chaya.zip -d project

      - name: Fix Missing Door Import
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("src/scenes/part1.tsx")

          if not file.exists():
              raise SystemExit("ERROR: part1.tsx not found")

          code = file.read_text(encoding="utf-8")

          pattern = r"(import\s*\{)([^}]*)(\}\s*from\s*['\"]\.\./kit/Props['\"]\s*;)"

          match = re.search(pattern, code)

          if not match:
              raise SystemExit("ERROR: Props import statement not found")

          imports = match.group(2)

          if not re.search(r"\bDoor\b", imports):
              imports = imports.rstrip() + ", Door"

              code = (
                  code[:match.start()]
                  + match.group(1)
                  + imports
                  + match.group(3)
                  + code[match.end():]
              )

              file.write_text(code, encoding="utf-8")

          print("SUCCESS: Door import checked/fixed.")
          PY

      - name: Install Dependencies
        working-directory: project
        run: |
          npm install --no-audit --no-fund

      - name: Render Video
        working-directory: project
        run: |
          mkdir -p out
          npx remotion render src/index.ts RahimerChaya out/rahimer-chaya.mp4 --concurrency=2

      - name: Upload Rendered Video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rahimer-Chaya-Video
          path: project/out/rahimer-chaya.mp4
          if-no-files-found: error
          retention-days: 7
