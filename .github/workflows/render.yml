name: Render Remotion Video (ZIP mounted, not extracted)

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Repo-relative path of the project ZIP"
        required: true
        default: "rafi-dopamine-video.zip"
      concurrency:
        description: "Remotion render concurrency (lower = less memory)"
        required: true
        default: "2"
  push:
    paths:
      - "rafi-dopamine-video.zip"

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ZIP_PATH: ${{ github.event.inputs.zip_path || 'rafi-dopamine-video.zip' }}
      RENDER_CONCURRENCY: ${{ github.event.inputs.concurrency || '2' }}
      COMPOSITION_ID: Main
      ENTRY_POINT: src/index.ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies (FUSE, FFmpeg, Chrome libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 fuse-overlayfs ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 \
            libxdamage1 libpango-1.0-0 libcairo2 libcups2 libxshmfence1
          echo "user_allow_other" | sudo tee -a /etc/fuse.conf
          pip install ratarmount

      - name: Check ZIP exists and list contents (listing only)
        run: |
          test -f "$ZIP_PATH" || { echo "::error::ZIP not found: $ZIP_PATH"; exit 1; }
          python3 -m zipfile -l "$ZIP_PATH" | grep -v "node_modules" | head -40

      - name: Mount ZIP read-only (no unzip) and add writable overlay
        run: |
          B="$RUNNER_TEMP/zipfs"
          mkdir -p "$B/ro" "$B/up" "$B/work" "$B/merged"
          ratarmount "$ZIP_PATH" "$B/ro"
          fuse-overlayfs -o lowerdir="$B/ro",upperdir="$B/up",workdir="$B/work" "$B/merged"
          echo "MERGED=$B/merged" >> "$GITHUB_ENV"

      - name: Detect and verify Remotion project inside the mounted ZIP
        run: |
          PKG=$(find "$MERGED" -maxdepth 2 -name package.json -not -path "*/node_modules/*" | head -1)
          test -n "$PKG" || { echo "::error::package.json not found in ZIP"; exit 1; }
          DIR=$(dirname "$PKG")
          test -f "$DIR/$ENTRY_POINT" || { echo "::error::Missing $ENTRY_POINT"; exit 1; }
          test -f "$DIR/public/voiceover.wav" || { echo "::error::Missing public/voiceover.wav"; exit 1; }
          grep -q "id=\"$COMPOSITION_ID\"" "$DIR/src/Root.tsx" || { echo "::error::Composition $COMPOSITION_ID not found"; exit 1; }
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Render video
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          npx remotion render "$ENTRY_POINT" "$COMPOSITION_ID" "$GITHUB_WORKSPACE/out/video.mp4" \
            --codec=h264 --concurrency="$RENDER_CONCURRENCY" --timeout=120000

      - name: Verify output (duration and audio)
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_type -of default=nw=1 out/video.mp4
          ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 out/video.mp4 | grep -q audio \
            || { echo "::error::No audio stream in output"; exit 1; }

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rafi-dopamine-video-mp4
          path: out/video.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Unmount
        if: always()
        run: |
          fusermount3 -u "$RUNNER_TEMP/zipfs/merged" || true
          fusermount3 -u "$RUNNER_TEMP/zipfs/ro" || true
