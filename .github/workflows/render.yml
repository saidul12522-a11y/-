
name: Render Video from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChatGPTIndiaExplainer_Backup_01_100pct.zip'
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Extract ZIP File
        run: |
          mkdir -p project
          unzip -q ChatGPTIndiaExplainer_Backup_01_100pct.zip -d project

      - name: Install Dependencies
        working-directory: project
        run: npm ci

      - name: Install Remotion Browser
        working-directory: project
        run: npx remotion browser ensure

      - name: Render MP4 Video
        working-directory: project
        run: |
          mkdir -p out
          npm run render

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTIndia-Rendered-Video
          path: project/out/chatgpt-india.mp4
          if-no-files-found: error
          retention-days: 7
