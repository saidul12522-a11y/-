
name: Render Ghazal Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract Project
        run: |
          unzip -q ghazal-tiktok23.zip -d project

      - name: Install Dependencies
        working-directory: project/ghazal-video
        run: npm install

      - name: Setup Browser
        working-directory: project/ghazal-video
        run: npx remotion browser ensure

      - name: Render MP4
        working-directory: project/ghazal-video
        run: npx remotion render src/index.ts Main out/video.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: ghazal-video-mp4
          path: project/ghazal-video/out/video.mp4
          retention-days: 7
