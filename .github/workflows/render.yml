
name: Render Mosquito Explainer Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: MosquitoExplainer

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MosquitoExplainer/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Remotion Browser
        run: npx remotion browser ensure

      - name: Render MP4 Video
        run: npm run render

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: Mosquito-Explainer-Video
          path: MosquitoExplainer/out/mosquito-explainer.mp4
          if-no-files-found: error
          retention-days: 7
