
name: Render Mosquito Explainer Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip -q "saidul-মশা-video.zip" -d project

      - name: Verify Project Files
        working-directory: project/MosquitoExplainer
        run: |
          test -f package.json
          test -f package-lock.json
          test -f public/voice.mp3
          echo "Project files verified."

      - name: Install Dependencies
        working-directory: project/MosquitoExplainer
        run: npm ci

      - name: Install Remotion Browser
        working-directory: project/MosquitoExplainer
        run: npx remotion browser ensure

      - name: Render Complete MP4
        working-directory: project/MosquitoExplainer
        run: |
          npx remotion render \
            src/index.ts \
            MosquitoExplainer \
            out/mosquito-explainer.mp4 \
            --concurrency=2

      - name: Verify Video Duration
        working-directory: project/MosquitoExplainer
        run: |
          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            out/mosquito-explainer.mp4)

          echo "Rendered duration: $DURATION seconds"

          awk -v d="$DURATION" 'BEGIN {
            if (d < 190) {
              print "ERROR: Video is incomplete!"
              exit 1
            }
            print "Video duration verified."
          }'

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: Mosquito-Explainer-Final
          path: project/MosquitoExplainer/out/mosquito-explainer.mp4
          if-no-files-found: error
          retention-days: 7
