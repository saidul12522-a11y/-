name: Render video

# Manual run: GitHub -> Actions -> "Render video" -> Run workflow.
# The finished MP4 is attached to the run as an artifact named "shit-keno-ashe-mp4".
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system libraries for Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2t64 libpango-1.0-0 libcairo2

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Render MP4
        run: npm run render

      - name: Check the MP4 (duration, size, fps)
        run: npx remotion ffprobe out/shit-keno-ashe.mp4 || true

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: shit-keno-ashe-mp4
          path: out/shit-keno-ashe.mp4
          if-no-files-found: error
          retention-days: 30
