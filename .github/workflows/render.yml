name: Render video

# Works in two layouts:
#  A) the repo root IS the unzipped project (package.json in the root), or
#  B) the repo root only holds the project ZIP (e.g. WinterDawnExplainer_Final_v01.zip) - it is unzipped automatically.
# Put this file at  .github/workflows/render.yml  in the repo root.
# Start it from the repo's  Actions  tab -> "Render video" -> "Run workflow".

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id"
        default: "WinterDawn"
      output_name:
        description: "Output file name"
        default: "winter-dawn.mp4"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project (unzip if needed)
        id: locate
        shell: bash
        run: |
          set -e
          if [ -f package.json ]; then
            DIR="."
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -z "$ZIP" ]; then echo "No package.json and no .zip found in repo root"; exit 1; fi
            echo "Using $ZIP"
            mkdir -p _project
            unzip -q "$ZIP" -d _project
            PKG=$(find _project -name package.json -not -path "*/node_modules/*" | head -n 1)
            DIR=$(dirname "$PKG")
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system libraries for headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 libcups2 || sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 libcups2

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npx tsc --noEmit

      - name: Render MP4
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "${{ inputs.composition }}" "out/${{ inputs.output_name }}" --codec=h264 --crf=18 --log=verbose

      - name: Check output
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration -of default=nw=1 "out/${{ inputs.output_name }}"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: ${{ steps.locate.outputs.dir }}/out/${{ inputs.output_name }}
          retention-days: 14
          if-no-files-found: error
