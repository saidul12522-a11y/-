name: Rafi Video Render Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rafi-video-test
  cancel-in-progress: false

jobs:
  render:
    name: Extract and Render
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Extract uploaded ZIP
      - name: Extract Main ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="rafi_video_all_files.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found!"
            exit 1
          fi

          unzip -tq "$ZIP"
          mkdir -p bundle
          unzip -q "$ZIP" -d bundle

          if [ ! -f bundle/github_test/project.zip ]; then
            echo "ERROR: Nested project.zip not found!"
            exit 1
          fi

          echo "Main ZIP extracted successfully."

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4. Install system dependencies
      - name: Install System Packages
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            unzip \
            ffmpeg \
            fonts-noto-core \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libgbm1 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64

          fc-cache -f

          echo "Bengali fonts:"
          fc-list :lang=bn | head -5

          ffmpeg -version | head -1

      # 5. Extract nested project ZIP
      - name: Extract Remotion Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work

          unzip -tq bundle/github_test/project.zip
          unzip -q bundle/github_test/project.zip -d work

          test -f work/package.json
          test -f work/ci/test.sh
          test -f work/src/index.jsx

          echo "Remotion project extracted."

      # 6. Install dependencies
      - name: Install Remotion Dependencies
        working-directory: work
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure

      # 7. Render compatibility test
      - name: Render Test Video
        working-directory: work
        run: |
          bash ci/test.sh

      # 8. Verify output
      - name: Verify Rendered Video
        if: success()
        working-directory: work
        run: |
          set -euo pipefail

          test -s out/test30.mp4
          test -s out/still.png
          test -s out/report.txt

          ffprobe -v error \
            -show_entries format=duration \
            -show_entries stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            out/test30.mp4

          echo "COMPATIBILITY TEST PASSED"

      # 9. Upload all outputs
      - name: Upload Render Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rafi-Video-Test-Results
          path: |
            work/out/
          if-no-files-found: warn
          retention-days: 7
